<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอโทษนะ</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1ee;--ink:#4a2a30;--soft:#8a5a62;--rose:#e0566f;--card:#ffffff;--line:#f3cfd0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;bottom:-40px;animation:up linear forwards;opacity:.8}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:20px}
#bar{display:flex;gap:6px;margin-bottom:12px}
#bar i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .3s}
#bar i.on{background:var(--rose)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.slide{display:none;width:100%;text-align:center;flex-direction:column;align-items:center;gap:16px;max-height:100%;overflow:auto;padding:6px}
.slide.show{display:flex;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
h1,h2{font-family:'Mali',cursive;font-weight:600;color:var(--rose);line-height:1.35}
h1{font-size:2.1rem}h2{font-size:1.6rem}
p{font-size:1.1rem;line-height:1.8;color:var(--ink)}
.photo{width:min(78vw,300px);aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:6px solid #fff;
 box-shadow:0 8px 24px rgba(120,40,60,.18);transform:rotate(-2deg);background:var(--line)}
.ph{display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:.95rem;padding:16px}
.cap{font-family:'Mali',cursive;color:var(--soft);font-size:1rem}
#nav{display:flex;gap:10px;padding-top:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 22px;font-weight:600}
#prev{background:transparent;color:var(--soft);border:1.5px solid var(--line)}
#next{flex:1;background:var(--rose);color:#fff}
#prev[hidden],#nav[hidden]{display:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ask{position:relative;width:100%;height:120px;display:flex;justify-content:center;gap:14px;align-items:flex-start}
#yes{background:var(--rose);color:#fff;font-size:1.15rem;padding:14px 30px}
#no{background:#fff;color:var(--soft);border:1.5px solid var(--line);position:relative;transition:transform .15s,left .15s,top .15s}
#no.run{position:fixed}
.final{font-size:1.15rem}
@media (prefers-reduced-motion:reduce){.slide.show{animation:none}.h{display:none}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<div id="app">
 <div id="bar"></div>
 <div id="stage"></div>
 <div id="nav"><button id="prev" hidden>ย้อนกลับ</button><button id="next">ต่อไป</button></div>
</div>

<script src="content.js"></script>
<script>
/* เนื้อหาทั้งหมดอยู่ในไฟล์ content.js ไม่ต้องแก้ไฟล์นี้ */
for(const k in THEME)document.documentElement.style.setProperty('--'+k,THEME[k]);
document.title=PAGE_TITLE;

const stage=document.getElementById('stage'),bar=document.getElementById('bar'),
 prev=document.getElementById('prev'),next=document.getElementById('next'),nav=document.getElementById('nav');
let i=0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const br=s=>esc(s).replace(/\n/g,'<br>');

slides.forEach((s,k)=>{
 const d=document.createElement('section');d.className='slide';
 if(s.type==='text')d.innerHTML=`<h2>${esc(s.title)}</h2><p>${br(s.body)}</p>`;
 if(s.type==='photo'){
  d.innerHTML=`<img class="photo" src="${s.src}" alt="${esc(s.cap)}"><div class="cap">${esc(s.cap)}</div>`;
  d.querySelector('img').onerror=function(){const p=document.createElement('div');p.className='photo ph';p.textContent='ใส่รูปไว้ที่ '+s.src;this.replaceWith(p)};
 }
 if(s.type==='ask')d.innerHTML=`<h1>ให้อภัยเราได้ไหม?</h1><p>เราตั้งใจขอโทษจริงๆ</p><div class="ask"><button id="yes">ได้</button><button id="no">ไม่</button></div>`;
 if(s.type==='final')d.innerHTML=`<h1>${esc(s.title)}</h1><p class="final">${br(s.body)}</p>`;
 stage.appendChild(d);
 const b=document.createElement('i');bar.appendChild(b);
});
const els=[...stage.children],dots=[...bar.children];

function go(n){
 i=Math.max(0,Math.min(slides.length-1,n));
 els.forEach((e,k)=>e.classList.toggle('show',k===i));
 dots.forEach((e,k)=>e.classList.toggle('on',k<=i));
 prev.hidden=i===0;
 const t=slides[i].type;
 nav.hidden=(t==='ask'||t==='final');
 if(t==='final')burst(40);
}
next.onclick=()=>go(i+1);prev.onclick=()=>go(i-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!nav.hidden)go(i+1);if(e.key==='ArrowLeft')go(i-1)});

function heart(){
 const h=document.createElement('div');h.className='h';h.textContent=['❤','💗','💕','🌸'][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*22)+'px';
 const t=4+Math.random()*4;h.style.animationDuration=t+'s';
 document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),t*1000);
}
function burst(n){for(let k=0;k<n;k++)setTimeout(heart,k*90)}
setInterval(heart,1800);

/* ปุ่ม "ไม่" วิ่งหนี */
const no=document.getElementById('no'),yes=document.getElementById('yes');
function flee(e){
 if(e&&e.preventDefault)e.preventDefault();
 no.classList.add('run');
 const w=no.offsetWidth,h=no.offsetHeight,pad=12;
 no.style.left=pad+Math.random()*(innerWidth-w-pad*2)+'px';
 no.style.top=60+Math.random()*(innerHeight-h-120)+'px';
}
no.addEventListener('mouseenter',flee);
no.addEventListener('touchstart',flee,{passive:false});
no.addEventListener('click',flee);
yes.onclick=()=>go(i+1);

go(0);
</script>
</body>
</html>
